<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ICD-10 Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            padding: 40px;
        }
        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        form {
            display: flex;
            margin-top: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px 0 0 8px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
        }
        .response {
            margin-top: 20px;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>ICD-10 Chatbot</h1>
        <form method="POST">
            <input type="text" name="query" placeholder="Ask about an ICD-10 code or coding rule..." required>
            <button type="submit">Ask</button>
        </form>

        {% if response %}
            <div class="response">
                <strong>Chatbot:</strong><br>
                {{ response }}
            </div>
        {% endif %}
    </div>
</body>
</html>
